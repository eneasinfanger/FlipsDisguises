rate-limit-millis: 1000

# INFO-level PacketEvents tracing (no need for Paper debug). Focused mode logs spawn/bundle/meta/equipment/tab/destroy/teams
# plus a few client packets. Enable mob-disguise-packet-trace-all-play for every Play packet (very noisy).
mob-disguise-packet-trace: false
mob-disguise-packet-trace-all-play: false
