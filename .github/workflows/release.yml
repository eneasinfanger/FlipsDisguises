name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean package -DskipTests

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          JAR=$(ls target/*.jar | grep -v '^target/original-' | head -n 1)
          NAME="FlipsDisguises-${TAG}.jar"
          cp "$JAR" "target/$NAME"
          gh release create "$TAG" "target/$NAME" \
            --title "$TAG" \
            --notes "$(git log -1 --format=%s)"
